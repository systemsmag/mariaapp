        <!-- JSON-LD: FAQPage — answers real questions about the restaurant -->
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "FAQPage",
                "mainEntity": [
                    {
                        "@type": "Question",
                        "name": "Unde se află restaurantul La Maria și Ion?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Restaurantul La Maria și Ion se află pe Splaiul Independenței 290, în Complexul Studențesc Regie, sector 6, București. Avem terasă mare și parcare gratuită."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Care este programul restaurantului La Maria și Ion?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Suntem deschiși zilnic, de luni până duminică, între orele 12:00 și 00:00. Bucătăria este deschisă pe toată durata programului."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Cum fac o rezervare la La Maria și Ion?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Rezervările se fac telefonic la numărul 0753 473 781 sau prin WhatsApp. Recomandăm rezervarea în avans, mai ales vineri și sâmbătă seara sau în zilele cu evenimente live."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Ce bucătărie servește La Maria și Ion?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Servim bucătărie tradițională românească autentică — mâncare la jar, mămăligă, ciorbe, sarmale, papanași — și paste italienești pe terasa din Regie, București. Avem și platouri pentru 2, 4 și 6 persoane."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Au evenimente live La Maria și Ion?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Da, organizăm seri tematice cu artiști live, transmisii live ale meciurilor importante (inclusiv Finala Champions League pe ecran mare) și petreceri. Vezi pagina Evenimente pentru următoarele date."
                        }
                    },
                    {
                        "@type": "Question",
                        "name": "Acceptați plata cu cardul?",
                        "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Da, acceptăm atât plata cash cât și cu cardul (debit, credit). Bacșișul este inclus în nota de plată."
                        }
                    }
                ]
            }
        </script>
